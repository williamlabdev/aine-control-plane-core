[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aine-control-plane"
version = "0.7.0"
description = "Provider-neutral, read-only contracts and reference primitives for AINE portfolio evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AINE contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/williamlabdev/aine-control-plane"
Repository = "https://github.com/williamlabdev/aine-control-plane.git"
Issues = "https://github.com/williamlabdev/aine-control-plane/issues"

[tool.setuptools.packages.find]
include = ["aine_control_plane*"]

[tool.setuptools.package-data]
aine_control_plane = ["schema/*.json", "fixtures/*.json"]
