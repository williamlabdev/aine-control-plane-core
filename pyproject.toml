[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aine-control-plane-core"
version = "0.3.0"
description = "Provider-neutral, read-only contracts and reference primitives for AINE portfolio evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AINE contributors" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["aine_control_plane_core*"]

[tool.setuptools.package-data]
aine_control_plane_core = ["schema/*.json", "fixtures/*.json"]
